name: Delete releases by tag prefix

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: Delete every release (and its tag) whose tag starts with this, for example preview-buffering-fix-
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete matching releases
        run: |
          set -euo pipefail
          prefix="${{ inputs.prefix }}"
          [ -n "$prefix" ] || { echo "empty prefix"; exit 1; }

          tags="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName')"
          found=0
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            case "$tag" in
              "$prefix"*)
                found=1
                echo "Deleting $tag"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
                ;;
            esac
          done <<< "$tags"
          [ "$found" -eq 1 ] || echo "No releases found with prefix '$prefix'; nothing to delete."
